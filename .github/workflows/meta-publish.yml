name: Kerime Ataker Meta Publisher

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Publish due items
        env:
          META_SYSTEM_USER_TOKEN: ${{ secrets.META_SYSTEM_USER_TOKEN }}
          FB_PAGE_ID: '883182878201071'
          IG_USER_ID: '17841476687386286'
          META_GRAPH_VERSION: 'v26.0'
        run: python scripts/meta_publish_entry.py

      - name: Save publish results
        run: |
          if git diff --quiet -- publish_queue; then
            exit 0
          fi
          git config user.name "kerime-ataker-publisher"
          git config user.email "actions@users.noreply.github.com"
          git add publish_queue
          git commit -m "Update Meta publish queue status"
          git push
